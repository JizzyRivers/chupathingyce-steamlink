# the probe (probe/) for the steam link, w valve's sdk: SDL3 at
# chupathingyce's pin, cross compiled w the sdk's toolchain against its root
# filesystem, then the probe linked to it and packed as a steam link app.
# the artifact's steamlink folder goes on a usb drive
name: Probe

on:
  push:
    branches: [main]
    paths: ["probe/**", "art/**", ".github/workflows/probe.yml"]
  workflow_dispatch:

env:
  # valve's steamlink-sdk, master on 2025-03-17
  STEAMLINK_SDK_COMMIT: 62b4d098d1472c3534dd098ca2a0e0e10712f1c6
  # chupathingyce's pin (tools/android_build.py: SDL_TAG, SDL_COMMIT)
  SDL_TAG: release-3.4.16
  SDL_COMMIT: fa2c02bb6e21974a89ea9824bc53c9932abe5f9c

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build file

      # saved straight after the fetch, before SDL3 goes into its root filesystem
      - uses: actions/cache/restore@v4
        id: sdk
        with:
          path: steamlink-sdk
          key: steamlink-sdk-${{ env.STEAMLINK_SDK_COMMIT }}

      # the toolchain and the root filesystem only: the whole sdk is 3 GB
      - name: Fetch the Steam Link SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          git init -q steamlink-sdk
          cd steamlink-sdk
          git remote add origin https://github.com/ValveSoftware/steamlink-sdk.git
          git sparse-checkout set toolchain rootfs
          git fetch -q --depth 1 --filter=blob:none origin "$STEAMLINK_SDK_COMMIT"
          git checkout -q FETCH_HEAD

      - uses: actions/cache/save@v4
        if: steps.sdk.outputs.cache-hit != 'true'
        with:
          path: steamlink-sdk
          key: steamlink-sdk-${{ env.STEAMLINK_SDK_COMMIT }}

      - name: Check the toolchain
        run: |
          source steamlink-sdk/setenv.sh
          file "$(command -v armv7a-cros-linux-gnueabi-gcc)"
          armv7a-cros-linux-gnueabi-gcc --version | head -1
          ls steamlink-sdk/rootfs/usr/lib | grep -iE 'egl|gles|sdl' || true

      # console only (SDL_UNIX_CONSOLE_BUILD): the box has no X11 or Wayland,
      # its screen is SDL's vivante driver. installed into the sdk's root
      # filesystem, as /usr, the way the sdk installs its own libraries
      # (setenv.sh: steamlink_make_install), so its sdl3.pc finds libpulse
      - name: Build SDL3
        run: |
          git clone -q --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL.git build/SDL
          test "$(git -C build/SDL rev-parse HEAD)" = "$SDL_COMMIT"
          export MARVELL_SDK_PATH=$PWD/steamlink-sdk
          source steamlink-sdk/setenv.sh
          cmake -S build/SDL -B build/SDL/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_VULKAN=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=ON
          cmake --build build/SDL/build
          DESTDIR="$MARVELL_ROOTFS" cmake --install build/SDL/build
          grep -E 'SDL_VIDEO_DRIVER_[A-Z]+ ' build/SDL/build/include-config-release/build_config/SDL_build_config.h || true

      - name: Build the probe
        run: bash probe/build_steamlink.sh

      - uses: actions/upload-artifact@v4
        with:
          name: steamlink-probe
          path: steamlink/
          retention-days: 30
